<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Helena Alves Horror Game</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:monospace;color:#fff}
  canvas{display:block}
  
  /* Ecrãs (Menu, Game Over) */
  .screen {
    position:absolute; inset:0; background:rgba(0,0,0,0.9); 
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    z-index:100; gap:15px; text-align: center;
  }
  .screen h1 { color: #8b0000; text-shadow: 2px 2px 5px #000; font-size: 40px; margin-bottom: 0;}
  .screen p { color: #ccc; max-width: 600px; line-height: 1.5;}
  .screen input{padding:10px;font-size:16px;width:200px;text-align:center; background: #222; color: #fff; border: 1px solid #555;}
  .screen button{padding:12px 24px;font-size:16px;background:#8b0000;color:#fff;border:2px solid #fff;cursor:pointer; font-weight: bold;}
  .screen button:hover { background: #ff0000; }
  
  #hud{position:absolute;top:10px;left:10px;font-size:16px;text-shadow: 1px 1px 2px #000; z-index: 10;}
  #jump{position:absolute;inset:0;background:#f00;display:none;z-index:50; background-size: cover; background-position: center;}
</style>
</head>
<body>

<!-- ECRÃ INICIAL -->
<div id="menuScreen" class="screen">
  <h1>Helena Alves Horror Game</h1>
  <p>A escola está vazia... mas ela anda por aí. Encontra os 6 manuais de português para poderes sair.</p>
  <input id="roomInput" placeholder="Código da sala (ou vazio para criar)">
  <div>
    <button id="createBtn">Criar Sala</button>
    <button id="joinBtn">Entrar na Sala</button>
  </div>
</div>

<!-- ECRÃ DE FIM DE JOGO -->
<div id="gameOverScreen" class="screen" style="display:none;">
  <h1 id="endTitle">GAME OVER</h1>
  <p id="endMessage">A Helena apanhou-te.</p>
  <button id="backToMenuBtn">Voltar ao Menu Principal</button>
</div>

<div id="hud">Manuais: <span id="count">0</span>/6</div>
<div id="jump"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const socket = io();
let roomId = null;
let scene, camera, renderer, player, helena, manuals = [], otherPlayers = {};
let keys = {}, yaw = 0, pitch = 0, running = false, dead = false, collected = 0;
const speed = 5, enemySpeed = 2.8;

const menuScreen = document.getElementById('menuScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

// --- SISTEMA DE MENUS E SALAS ---
document.getElementById('createBtn').onclick = () => {
  socket.emit('createRoom', (res) => {
    roomId = res.roomId;
    alert('Sala criada: ' + roomId + '\nPassa este código aos teus amigos.');
    startGame();
  });
};

document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) return alert('Escreve um código de sala!');
  socket.emit('joinRoom', { roomId: code }, (res) => {
    if (res.error) return alert(res.error);
    roomId = code;
    startGame();
  });
};

document.getElementById('backToMenuBtn').onclick = () => {
  window.location.reload(); // Recarrega a página para limpar tudo e voltar ao menu inicial
};

function startGame() {
  menuScreen.style.display = 'none';
  gameOverScreen.style.display = 'none';
  running = true;
  initThree();
  document.body.requestPointerLock();
}

function endGame(title, msg) {
  running = false;
  document.exitPointerLock();
  document.getElementById('endTitle').innerText = title;
  document.getElementById('endMessage').innerText = msg;
  gameOverScreen.style.display = 'flex';
}

// --- CRIAÇÃO DO MUNDO 3D ---
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.FogExp2(0x050505, 0.04); // Nevoeiro mais leve
  
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Iluminação (Luz da escola - amarelada e fraca)
  scene.add(new THREE.AmbientLight(0x886644, 0.5));
  const dl = new THREE.DirectionalLight(0xffeedd, 0.6);
  dl.position.set(10,20,10);
  dl.castShadow = true;
  scene.add(dl);

  // --- CONSTRUÇÃO DA ESCOLA ---
  // Chão (Textura de madeira/ladrilho)
  const floorTex = new THREE.CanvasTexture(createWoodTexture());
  floorTex.wrapS = THREE.RepeatWrapping;
  floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(30, 30);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({map: floorTex}));
  floor.rotation.x = -Math.PI/2; 
  floor.receiveShadow = true;
  scene.add(floor);

  // Teto
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x111111}));
  ceiling.rotation.x = Math.PI/2;
  ceiling.position.y = 4;
  scene.add(ceiling);

  // Paredes com Rodapé
  const wallMat = new THREE.MeshStandardMaterial({color:0xdddddd}); // Branco sujo
  const baseboardMat = new THREE.MeshStandardMaterial({color:0x223366}); // Rodapé azul escuro
  const wallGeo = new THREE.BoxGeometry(10,4,1);
  const baseboardGeo = new THREE.BoxGeometry(10, 0.5, 1.1);

  // Layout do Labirinto Escolar
  const walls = [[0,-20,0],[0,20,0],[-20,0,Math.PI/2],[20,0,Math.PI/2],[-5,-10,0],[5,-10,0],[-5,10,0],[5,10,0],[-10,0,Math.PI/2],[10,0,Math.PI/2],[0,-5,0],[0,5,0]];
  
  walls.forEach(([x,z,r])=>{
    const w = new THREE.Mesh(wallGeo, wallMat);
    w.position.set(x,2,z); w.rotation.y = r; w.castShadow = true; w.receiveShadow = true;
    scene.add(w);

    // Adicionar rodapé na base da parede
    const b = new THREE.Mesh(baseboardGeo, baseboardMat);
    b.position.set(x, 0.25, z); b.rotation.y = r;
    scene.add(b);
  });

  // Cacifos Escolares (Lockers) para dar ambiente
  const lockerMatRed = new THREE.MeshStandardMaterial({color:0x8b0000});
  const lockerMatGreen = new THREE.MeshStandardMaterial({color:0x005522});
  for(let i=0; i<4; i++) {
      const locker = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 0.8), i%2===0 ? lockerMatRed : lockerMatGreen);
      locker.position.set(-12 + (i*2), 1.5, -12); // Num canto
      locker.castShadow = true; locker.receiveShadow = true;
      scene.add(locker);
  }

  // Quadros de Português nas paredes
  const quadroMat = new THREE.MeshStandardMaterial({color:0x111111, emissive: 0x222200});
  for(let i=0; i<6; i++){
      const quadro = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 0.1), quadroMat);
      quadro.position.set(12 - (i*3), 2.5, -19.4);
      scene.add(quadro);
  }

  player = new THREE.Object3D();
  player.position.set(0,1.6,0); 
  scene.add(player);

  // --- HELENA (A PROFESSORA) ---
  helena = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(1,2,0.5), new THREE.MeshStandardMaterial({color:0x2a1a1a}));
  body.position.y = 1; body.castShadow = true;
  helena.add(body);
  
  // FOTO DA HELENA (Carregamento seguro)
  const textureLoader = new THREE.TextureLoader();
  // Adicionamos um timestamp no final para forçar o navegador a procurar a versão mais recente e não usar cache antiga
  textureLoader.load('/helena.jpg?v=2', (texture) => {
      texture.minFilter = THREE.LinearFilter; // Corrige problemas de tamanho da imagem
      const faceGeo = new THREE.PlaneGeometry(1, 1);
      const faceMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const face = new THREE.Mesh(faceGeo, faceMat);
      face.position.set(0, 2.2, 0.26);
      helena.add(face);
  }, undefined, (err) => {
      console.error("ERRO AO CARREGAR FOTO:", err);
  });

  const headBase = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.MeshStandardMaterial({color:0xffccaa}));
  headBase.position.y = 2.2; helena.add(headBase);

  // Olhos vermelhos
  const eyeGeo = new THREE.SphereGeometry(0.08);
  const eyeMat = new THREE.MeshBasicMaterial({color:0xff0000});
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.2,2.3,0.27);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.2,2.3,0.27);
  helena.add(eyeL, eyeR);

  helena.position.set(15,0,15); 
  scene.add(helena);

  // Manuais de Português (Livros amarelos)
  const positions = [[-15,5],[15,-5],[0,15],[-12,-12],[12,12],[5,-15]];
  positions.forEach(([x,z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.1), new THREE.MeshStandardMaterial({color:0xffcc00, emissive:0x442200}));
    m.position.set(x,1,z); m.castShadow = true;
    scene.add(m); manuals.push(m);
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  addEventListener('keydown', e => keys[e.code] = true);
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('mousemove', e => {
    if (!running || dead) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  });

  animate();
}

// --- FUNÇÕES AUXILIARES ---
function createWoodTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#6b4c3a'; // Castanho
    ctx.fillRect(0, 0, 512, 512);
    ctx.strokeStyle = '#4a3326';
    ctx.lineWidth = 4;
    for(let i=0; i<512; i+=64) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    }
    return canvas;
}

let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  if (!running) return;
  const delta = (performance.now() - lastTime) / 1000;
  lastTime = performance.now();

  if (!dead) {
    const dir = new THREE.Vector3();
    if (keys['KeyW']) dir.z -= 1;
    if (keys['KeyS']) dir.z += 1;
    if (keys['KeyA']) dir.x -= 1;
    if (keys['KeyD']) dir.x += 1;
    
    if (dir.length() > 0) {
      dir.normalize().applyEuler(new THREE.Euler(0, yaw, 0));
      const nx = player.position.x + dir.x * speed * delta;
      const nz = player.position.z + dir.z * speed * delta;
      if (Math.abs(nx) < 19 && Math.abs(nz) < 19) { // Limites da escola
        player.position.x = nx;
        player.position.z = nz;
      }
    }
    socket.emit('move', { roomId, x: player.position.x, z: player.position.z, yaw });

    const d = helena.position.distanceTo(player.position);
    if (d > 1) {
      const dirE = new THREE.Vector3().subVectors(player.position, helena.position).normalize();
      helena.position.add(dirE.multiplyScalar(enemySpeed * delta));
      helena.lookAt(player.position.x, helena.position.y + 2.2, player.position.z);
    }
    if (d < 1.5) triggerDeath();

    manuals.forEach((m) => {
      if (m.visible && player.position.distanceTo(m.position) < 2) {
        m.visible = false;
        socket.emit('collectManual', { roomId });
        collected++;
        document.getElementById('count').innerText = collected;
        if (collected >= 6) {
            endGame("VITÓRIA!", "Encontraste todos os manuais e escapaste da Helena!");
            socket.emit('gameWon'); // Avisa os outros jogadores
        }
      }
    });
  }

  camera.position.copy(player.position);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  renderer.render(scene, camera);
}

function triggerDeath() {
  dead = true;
  const jumpDiv = document.getElementById('jump');
  jumpDiv.style.display = 'block';
  jumpDiv.style.backgroundImage = "url('/helena.jpg')"; // Usa a foto no susto
  
  socket.emit('died', { roomId });
  
  setTimeout(() => {
    jumpDiv.style.display = 'none';
    player.position.set(0,1.6,0);
    helena.position.set(15,0,15);
    dead = false;
    socket.emit('respawn', { roomId });
  }, 5000);
}

// --- EVENTOS DO SERVIDOR (SOCKET) ---
socket.on('playerMoved', ({id, x, z, yaw}) => {
  if (!otherPlayers[id]) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.8,0.4), new THREE.MeshStandardMaterial({color:0x3366ff}));
    b.position.y = 0.9; g.add(b);
    scene.add(g);
    otherPlayers[id] = g;
  }
  otherPlayers[id].position.set(x, 0, z);
  otherPlayers[id].rotation.y = yaw;
});

socket.on('playerLeft', ({id}) => {
  if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; }
});

socket.on('manualCount', (n) => {
  collected = n;
  document.getElementById('count').innerText = n;
});

socket.on('gameWon', () => {
    endGame("VITÓRIA!", "A tua equipa encontrou os 6 manuais e escapou!");
});

socket.on('gameOver', () => { 
    endGame("GAME OVER", "Todos os jogadores foram apanhados pela Helena Alves. A escola fica para ela..."); 
});
</script>
</body>
</html>
