<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Helena Alves Horror Game</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#fff}
  canvas{display:block}
  
  .screen {
    position:absolute; inset:0; background:rgba(0,0,0,0.95); 
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    z-index:100; gap:15px; text-align: center;
  }
  .screen h1 { color: #8b0000; text-shadow: 3px 3px 6px #000; font-size: 45px; margin-bottom: 0; font-family: 'Georgia', serif;}
  .screen p { color: #ccc; max-width: 600px; line-height: 1.5; font-size: 16px;}
  .screen input{padding:10px;font-size:16px;width:200px;text-align:center; background: #222; color: #fff; border: 2px solid #555;}
  .screen button{padding:12px 24px;font-size:16px;background:#8b0000;color:#fff;border:2px solid #fff;cursor:pointer; font-weight: bold; margin: 5px; transition: 0.3s;}
  .screen button:hover { background: #ff0000; transform: scale(1.05);}
  
  #hud{position:absolute;top:15px;left:15px;font-size:18px;text-shadow: 2px 2px 3px #000; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-left: 4px solid #8b0000;}
  #sanityHud { color: #00ffcc; font-weight: bold; }
  #jump{position:absolute;inset:0;background:#000;display:none;z-index:50; background-size: contain; background-repeat: no-repeat; background-position: center; border: 20px solid #500;}
  
  #lobbyScreen { display: none; }
  #lobbyList { font-size: 20px; color: #fff; margin: 20px 0; }
  
  .blood-text { color: #ff0000; animation: pulse 1s infinite; }
  @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
</style>
</head>
<body>

<div id="menuScreen" class="screen">
  <h1>Helena Alves Horror Game</h1>
  <p>Encontra os 6 manuais de português. Cuidado com os poemas malditos e com o Livro de Camões...</p>
  <input id="roomInput" placeholder="Código da sala (ou vazio para criar)">
  <div>
    <button id="createBtn">Criar Sala</button>
    <button id="joinBtn">Entrar na Sala</button>
  </div>
</div>

<div id="lobbyScreen" class="screen">
  <h1>Sala de Espera</h1>
  <p>Código da Sala: <strong id="displayRoomCode" style="font-size:24px; color:yellow;"></strong></p>
  <div id="lobbyList">Jogadores: 1</div>
  <button id="startGameBtn" style="display:none; background:#005500;">Começar Jogo (Apenas Host)</button>
  <p id="waitMsg" style="color: #aaa;">À espera que o criador comece o jogo...</p>
</div>

<div id="gameOverScreen" class="screen" style="display:none;">
  <h1 id="endTitle" class="blood-text">GAME OVER</h1>
  <p id="endMessage">A Helena apanhou-te.</p>
  <button id="backToMenuBtn">Voltar ao Menu Principal</button>
</div>

<div id="hud">
    Manuais: <span id="count">0</span>/6<br>
    <span id="sanityHud">Sanidade: 1</span>
</div>
<div id="jump"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const socket = io();
let roomId = null, isHost = false;
let scene, camera, renderer, player, helena, manuals = [], diaries = [], poems = [], otherPlayers = {};
let keys = {}, yaw = 0, pitch = 0, running = false, dead = false, collected = 0, sanity = 1;
let collidableBoxes = []; 
const speed = 5;
let enemySpeed = 2.5;
let isHelenaBlind = false; // Mecânica do Livro de Camões
let lightFlickerTime = 0;

// Elementos UI
const menuScreen = document.getElementById('menuScreen');
const lobbyScreen = document.getElementById('lobbyScreen');
const gameOverScreen = document.getElementById('gameOverScreen');

// ... (Lógica de Menus e Lobby igual à anterior) ...
document.getElementById('createBtn').onclick = () => {
  socket.emit('createRoom', (res) => {
    roomId = res.roomId; isHost = true;
    document.getElementById('displayRoomCode').innerText = roomId;
    document.getElementById('startGameBtn').style.display = 'block';
    document.getElementById('waitMsg').style.display = 'none';
    menuScreen.style.display = 'none'; lobbyScreen.style.display = 'flex';
  });
};
document.getElementById('joinBtn').onclick = () => {
  const code = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!code) return alert('Escreve um código!');
  socket.emit('joinRoom', { roomId: code }, (res) => {
    if (res.error) return alert(res.error);
    roomId = code; isHost = false;
    document.getElementById('displayRoomCode').innerText = roomId;
    menuScreen.style.display = 'none'; lobbyScreen.style.display = 'flex';
    if(res.started) startGame();
  });
};
document.getElementById('startGameBtn').onclick = () => { socket.emit('startGame', { roomId }); };
socket.on('updateLobby', (count) => { document.getElementById('lobbyList').innerText = `Jogadores na sala: ${count}`; });
socket.on('gameStarted', () => { startGame(); });
document.getElementById('backToMenuBtn').onclick = () => { window.location.reload(); };

function startGame() {
  lobbyScreen.style.display = 'none'; menuScreen.style.display = 'none';
  running = true; initThree(); document.body.requestPointerLock();
}

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.FogExp2(0x050505, 0.04);
  
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Iluminação
  scene.add(new THREE.AmbientLight(0x332222, 0.4)); 
  const flashlight = new THREE.PointLight(0xffeedd, 1.8, 18);
  camera.add(flashlight); scene.add(camera);

  // Luz vermelha da Helena
  const helenaLight = new THREE.PointLight(0xff0000, 2, 10);
  helenaLight.name = "helenaLight";
  scene.add(helenaLight);

  buildBeautifulSchool();

  player = new THREE.Object3D();
  player.position.set(0,1.6,0); scene.add(player);

  buildHelena();
  
  // Manuais normais (amarelos)
  const manualPos = [[-15, 1, 5], [15, 1, -5], [-12, 1, -12], [12, 1, 12], [5, 1, -15]];
  manualPos.forEach(([x,y,z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.8,0.15), new THREE.MeshStandardMaterial({color:0xffcc00, emissive:0x442200}));
    m.position.set(x,y,z); m.castShadow = true;
    scene.add(m); manuals.push(m);
  });

  // O Livro de Camões (Manual especial)
  const camoesBook = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.8,0.15), new THREE.MeshStandardMaterial({color:0x0000ff, emissive:0x000088}));
  camoesBook.position.set(0, 1, 15); // No fundo da escola
  scene.add(camoesBook); manuals.push(camoesBook);

  // Poemas Malditos (Papéis no chão)
  const poemPos = [[-5, 0.1, 5], [8, 0.1, 8], [-10, 0.1, 10]];
  poemPos.forEach(([x,y,z]) => {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1), new THREE.MeshStandardMaterial({color:0xeeeeee, side: THREE.DoubleSide}));
    p.rotation.x = -Math.PI/2; p.position.set(x,y,z);
    scene.add(p); poems.push(p);
  });

  // Eventos
  addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  addEventListener('keydown', e => keys[e.code] = true);
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('mousemove', e => {
    if (!running || dead) return;
    yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  });

  animate();
}

// --- ESCOLA BONITA (Texturas Procedurais) ---
function createTexture(type) {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    if (type === 'wall') {
        ctx.fillStyle = '#b0a090'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#8a7a6a'; // Linhas de tijolo
        for(let i=0; i<256; i+=32) { ctx.fillRect(0, i, 256, 2); }
        for(let i=0; i<256; i+=64) { ctx.fillRect(i, 0, 2, 256); }
    } else if (type === 'floor') {
        ctx.fillStyle = '#4a2e15'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#3a2210'; // Tábuas de madeira
        for(let i=0; i<256; i+=32) { ctx.fillRect(i, 0, 2, 256); }
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for(let i=0; i<256; i+=32) { ctx.fillRect(i+4, 0, 1, 256); }
    } else if (type === 'poster') {
        ctx.fillStyle = '#ddd'; ctx.fillRect(0,0,256,256);
        ctx.fillStyle = '#000'; ctx.font = '20px Courier'; 
        ctx.fillText('LÍNGUA', 20, 50); ctx.fillText('PORTUGUESA', 20, 80);
        ctx.fillStyle = '#8b0000'; ctx.font = 'bold 40px Georgia';
        ctx.fillText('OS', 100, 150); ctx.fillText('LUZÍADAS', 40, 200);
    }
    return new THREE.CanvasTexture(canvas);
}

function buildBeautifulSchool() {
    const wallMat = new THREE.MeshStandardMaterial({map: createTexture('wall')}); 
    const floorMat = new THREE.MeshStandardMaterial({map: createTexture('floor')});
    const posterMat = new THREE.MeshBasicMaterial({map: createTexture('poster')});

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), floorMat);
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshStandardMaterial({color:0x111111}));
    ceiling.rotation.x = Math.PI/2; ceiling.position.y = 5; scene.add(ceiling);

    function createWall(x, z, w, h, d, rot=0) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        wall.position.set(x, h/2, z); wall.rotation.y = rot;
        wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
        collidableBoxes.push({ x, z, w, d, rot });
    }

    // Paredes Exteriores
    createWall(0, -20, 40, 5, 1); createWall(0, 20, 40, 5, 1);
    createWall(-20, 0, 1, 5, 40); createWall(20, 0, 1, 5, 40);
    
    // Labirinto Escolar (Salas de aula)
    createWall(-5, -5, 15, 5, 1); createWall(8, 8, 15, 5, 1);
    createWall(10, -10, 1, 5, 15); createWall(-10, 10, 1, 5, 15);

    // Quadros de Português (Posters)
    for(let i=0; i<3; i++) {
        const p = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), posterMat);
        p.position.set(-5 + (i*5), 2.5, -19.4); scene.add(p);
    }

    // Cacifos Coloridos (Lockers)
    for(let i=0; i<4; i++) {
        const locker = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.8), new THREE.MeshStandardMaterial({color: i%2===0 ? 0x8b0000 : 0x003366}));
        locker.position.set(18.5, 2, -10 + (i*3)); scene.add(locker);
        collidableBoxes.push({ x: 18.5, z: -10 + (i*3), w: 2, d: 0.8, rot: 0 });
    }

    // Luzes do teto (piscam)
    for(let i=0; i<4; i++) {
        const l = new THREE.PointLight(0xffffaa, 0.8, 15);
        l.position.set(-15 + (i*10), 4.5, 0);
        l.name = "flickerLight";
        scene.add(l);
    }
}

// --- A CARA DA HELENA (RESOLVIDO) ---
function buildHelena() {
    helena = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(1,2,0.5), new THREE.MeshStandardMaterial({color:0x111111}));
    body.position.y = 1; body.castShadow = true; helena.add(body);
    
    // Criar um elemento de imagem HTML escondido para ler a foto e transformar em textura
    const img = new Image();
    img.src = '/helena.jpg';
    img.onload = () => {
        const texture = new THREE.Texture(img);
        texture.needsUpdate = true; // Força o Three.js a ler a imagem
        texture.minFilter = THREE.LinearFilter;
        const faceMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
        const face = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), faceMat);
        face.position.set(0, 2.2, 0.26);
        helena.add(face);
    };
    img.onerror = () => {
        console.error("FOTO NÃO ENCONTRADA. Verifica se se chama helena.jpg no GitHub.");
        const fallback = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), new THREE.MeshBasicMaterial({color:0xff0000}));
        fallback.position.y = 2.2; helena.add(fallback);
    };

    helena.position.set(15,0,15); 
    scene.add(helena);
}

// --- COLISÕES ---
function checkCollision(nx, nz) {
    if (nx > 19.5 || nx < -19.5 || nz > 19.5 || nz < -19.5) return true;
    for (let box of collidableBoxes) {
        let dx = Math.abs(nx - box.x); let dz = Math.abs(nz - box.z);
        if (box.rot === 0) { if (dx < (box.w/2 + 0.4) && dz < (box.d/2 + 0.4)) return true; }
        else { if (dx < (box.d/2 + 0.4) && dz < (box.w/2 + 0.4)) return true; }
    }
    return false;
}

let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  if (!running) return;
  const delta = (performance.now() - lastTime) / 1000;
  lastTime = performance.now();

  // Efeito de luz a piscar
  lightFlickerTime += delta;
  if(lightFlickerTime > 0.1) {
      lightFlickerTime = 0;
      scene.children.forEach(c => {
          if(c.name === "flickerLight") {
              c.intensity = Math.random() > 0.1 ? 0.8 : 0.2; // 10% de chance de apagar
          }
      });
  }

  if (!dead) {
    const dir = new THREE.Vector3();
    if (keys['KeyW']) dir.z -= 1;
    if (keys['KeyS']) dir.z += 1;
    if (keys['KeyA']) dir.x -= 1;
    if (keys['KeyD']) dir.x += 1;
    
    let currentSpeed = speed;
    if (window.speedBoostTime && Date.now() < window.speedBoostTime) currentSpeed *= 1.6; // Boost do poema

    if (dir.length() > 0) {
      dir.normalize().applyEuler(new THREE.Euler(0, yaw, 0));
      const nx = player.position.x + dir.x * currentSpeed * delta;
      const nz = player.position.z + dir.z * currentSpeed * delta;
      if (!checkCollision(nx, player.position.z)) player.position.x = nx;
      if (!checkCollision(player.position.x, nz)) player.position.z = nz;
    }

    socket.emit('move', { roomId, x: player.position.x, z: player.position.z, yaw });

    // Movimento da Helena
    const helenaLight = scene.getObjectByName("helenaLight");
    helenaLight.position.copy(helena.position); helenaLight.position.y += 2;

    if (!isHelenaBlind) {
        const d = helena.position.distanceTo(new THREE.Vector3(player.position.x, 0, player.position.z));
        if (d > 1) {
          const dirE = new THREE.Vector3().subVectors(player.position, helena.position).normalize();
          helena.position.add(dirE.multiplyScalar(enemySpeed * delta));
          helena.lookAt(player.position.x, helena.position.y + 2.2, player.position.z);
        }
        if (d < 1.5) triggerDeath();
    } else {
        // Se estiver cega, anda aleatoriamente
        helena.position.x += Math.sin(Date.now()*0.002) * 1 * delta;
        helena.position.z += Math.cos(Date.now()*0.002) * 1 * delta;
    }

    // Apanhar Livros
    manuals.forEach((m, idx) => {
      if (m.visible && player.position.distanceTo(m.position) < 2) {
        m.visible = false;
        socket.emit('collectManual', { roomId });
        collected++;
        document.getElementById('count').innerText = collected;
        
        // Se for o Livro de Camões (azul)
        if (idx === manuals.length - 1) {
            isHelenaBlind = true;
            helenaLight.color.setHex(0x0000ff); // Fica azul
            document.getElementById('sanityHud').innerText = "Cegaste a Helena com Camões! (15s)";
            setTimeout(() => {
                isHelenaBlind = false;
                helenaLight.color.setHex(0xff0000);
                document.getElementById('sanityHud').innerText = `Sanidade: ${sanity}`;
            }, 15000);
        }
        if (collected >= 6) endGame("VITÓRIA!", "Escapaste da escola e da Helena Alves!");
      }
    });

    // Apanhar Poemas
    poems.forEach((p) => {
        if (p.visible && player.position.distanceTo(p.position) < 1.5) {
            p.visible = false;
            window.speedBoostTime = Date.now() + 5000; // 5s de boost
            // Teleporta a Helena para perto
            helena.position.set(player.position.x + 8, 0, player.position.z + 8);
            document.getElementById('sanityHud').innerText = "Leste um poema! A Helena ouviu-te!";
            setTimeout(() => { document.getElementById('sanityHud').innerText = `Sanidade: ${sanity}`; }, 4000);
        }
    });
  }

  camera.position.copy(player.position);
  camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
  renderer.render(scene, camera);
}

function triggerDeath() {
  if (sanity > 1) {
      sanity--;
      document.getElementById('sanityHud').innerText = `Sanidade: ${sanity}`;
      player.position.set(-15, 1.6, -15); helena.position.set(15, 0, 15); return;
  }

  dead = true;
  const jumpDiv = document.getElementById('jump');
  jumpDiv.style.display = 'block';
  
  // Ecrã de susto usando a imagem
  jumpDiv.style.backgroundImage = "url('/helena.jpg')";
  
  socket.emit('died', { roomId });
  
  setTimeout(() => {
    jumpDiv.style.display = 'none';
    player.position.set(0,1.6,0); helena.position.set(15,0,15); dead = false;
    socket.emit('respawn', { roomId });
  }, 4000);
}

function endGame(title, msg) {
  running = false; document.exitPointerLock();
  document.getElementById('endTitle').innerText = title;
  document.getElementById('endMessage').innerText = msg;
  gameOverScreen.style.display = 'flex';
}

// --- REDE ---
socket.on('playerMoved', ({id, x, z, yaw}) => {
  if (!otherPlayers[id]) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.8,0.4), new THREE.MeshStandardMaterial({color:0x3366ff}));
    b.position.y = 0.9; g.add(b); scene.add(g); otherPlayers[id] = g;
  }
  otherPlayers[id].position.set(x, 0, z); otherPlayers[id].rotation.y = yaw;
});
socket.on('playerLeft', ({id}) => { if (otherPlayers[id]) { scene.remove(otherPlayers[id]); delete otherPlayers[id]; } });
socket.on('manualCount', (n) => { collected = n; document.getElementById('count').innerText = n; });
socket.on('gameWon', () => endGame("VITÓRIA!", "A equipa escapou!"));
socket.on('gameOver', () => endGame("GAME OVER", "A Helena apanhou todos..."));
</script>
</body>
</html>
